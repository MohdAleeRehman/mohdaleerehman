name: Generate contribution snake

on:
schedule:
- cron: "0 0 * * *"

workflow_dispatch:

permissions:
contents: write

jobs:
generate:
runs-on: ubuntu-latest
timeout-minutes: 10

```
steps:
  - name: Checkout profile repository
    uses: actions/checkout@v4
    with:
      fetch-depth: 0

  - name: Generate contribution snake
    uses: Platane/snk/svg-only@v3
    with:
      github_user_name: MohdAleeRehman
      outputs: |
        dist/github-contribution-grid-snake.svg
        dist/github-contribution-grid-snake-dark.svg?palette=github-dark

  - name: Install generated SVGs
    run: |
      mkdir -p assets
      cp dist/github-contribution-grid-snake.svg assets/github-contribution-grid-snake.svg
      cp dist/github-contribution-grid-snake-dark.svg assets/github-contribution-grid-snake-dark.svg

  - name: Commit generated snake
    run: |
      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      git add assets/github-contribution-grid-snake.svg
      git add assets/github-contribution-grid-snake-dark.svg

      if git diff --cached --quiet; then
        echo "No changes to commit."
        exit 0
      fi

      git commit -m "chore: update contribution snake"
      git push
```
